<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Digital Encomiendas</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #2d3748;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 8px;
            color: #2f3b52;
            font-size: 25px;
            font-weight: 700;
            border: none;
            padding: 0;
        }

        h2::after {
            content: "Gestión digital de conserjería";
            display: block;
            margin-top: 6px;
            color: #718096;
            font-size: 14px;
            font-weight: 400;
        }

        h3 {
            margin: 0 0 20px;
            color: #2f3b52;
            font-size: 19px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4a5568;
            font-size: 13px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d9dee7;
            border-radius: 9px;
            background: #ffffff;
            color: #2d3748;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        input:focus,
        select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.12);
        }

        input::placeholder {
            color: #a0aec0;
        }

        button {
            width: 100%;
            min-height: 46px;
            padding: 11px 16px;
            border: none;
            border-radius: 9px;
            background: #6c5ce7;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.20);
        }

         button:hover {
             background: #5b4cc4;
             transform: translateY(-1px);
        }

        button:active {
             transform: translateY(0);
        }    

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .separator {
            margin: 28px 0;
            border-top: 1px solid #e5e9f0;
        }

        #statusMessage,
        #searchMessage {
            display: none;
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 9px;
            font-weight: 600;
            text-align: center;
            font-size: 13px;
        }

        #resultadoConsulta {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .dato {
            margin-bottom: 13px;
            color: #4a5568;
            font-size: 14px;
        }

        .dato:last-child {
            margin-bottom: 0;
        }

        .dato strong {
            display: inline-block;
            min-width: 105px;
            color: #2f3b52;
        }

        .estado {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #6c5ce7;
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            min-width: 80px;
            text-align: center;
        }

        #accionRetiro {
            margin-top: 18px !important;
        }

        #btnRegistrarRetiro {
            background: #10b981 !important;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.18);
        }

        #btnRegistrarRetiro:hover {
            background: #059669 !important;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px 10px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 14px;
            }

            h2 {
                font-size: 22px;
            }

            h3 {
                font-size: 18px;
            }
        }
        
        .btn-consulta {
            background: #ffffff;
            color: #4a5568;
            border: 1px solid #d9dee7;
            box-shadow: none;
            font-size: 14px;
        }
        
        .btn-consultar:hover {
            background: #f8fafc;
            color: #6c5ce7;
            border-color: #6c5ce7;
        }


        /* ==========================================
                         PANEL CONSULTA
         ========================================== */

        .panel-consulta {
            display: none;
            margin-top: 18px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }


        /* ==========================================
                   ENCABEZADO CONSULTA
         ========================================== */
        
        .consulta-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .consulta-header h3 {
            margin: 0;
        }


        /* ==========================================
                        BOTÓN CERRAR
         ========================================== */

        .btn-cerrar {
            width: 34px;
            min-height: 34px;
            height: 34px;
            padding: 0;
            border-radius: 50%;
            background: #edf2f7;
            color: #4a5568;
            font-size: 22px;
            line-height: 1;
            box-shadow: none;
        }

        .btn-cerrar:hover {
            background: #e2e8f0;
            color: #2d3748;
            transform: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Control Encomiendas</h2>

    <!-- ========================= -->
    <!--  REGISTRO DE ENCOMIENDA   -->
    <!-- ========================= -->

    <form
        id="encomiendaForm"
        action="https://script.google.com/macros/s/AKfycbweVE252ukrunlxgLPht9Xcgn1JZd5dB0yEwX43zgne6S8A1ifVGOAVJ4-k7uKE4Ua0xg/exec"
        method="POST"
    >

        <div class="group">
            <label>Nombre/Apellido del Residente</label>
            <input
                type="text"
                name="nombre"
                required
                placeholder="Ej: Juan Pérez"
            >
        </div>

        <div class="group">
            <label>Número Depto</label>
            <input
                type="number"
                name="depto"
                required
                placeholder="Ej: 119"
            >
        </div>

        <div class="group">
            <label>Bulto/Paquete</label>

            <select name="bulto" required>
                <option value="">Elegir...</option>
                <option value="Paquete">Paquete</option>
                <option value="Sobre">Sobre / Documento</option>
                <option value="Caja">Caja / Bulto</option>
            </select>
        </div>

        <div class="group">
            <label>Fono Residente</label>

            <input
                type="tel"
                name="fono"
                required
                placeholder="Ej: 56912345678"
                pattern="[0-9]{11}"
            >
        </div>

        <button type="submit">
            Registrar y Enviar
        </button>

    </form>

    <div id="statusMessage"></div>

    <!-- ========================= -->
    <!--        SEPARADOR          -->
    <!-- ========================= -->

    <div class="separator"></div>

    <!-- ========================= -->
    <!--         CONSULTA          -->
    <!-- ========================= -->

    <button type="button" id="btnAbrirConsulta" class="btn-Consulta">
        🔎 Consultar Encomienda
    </button>
    
    <div id="panelConsulta" class="panel-Consulta">
        <div class="consulta-header">
            <h3>🔎 Consultar Encomienda</h3>
            <button type="button" id="btnCerrarConsulta" class="btn-cerrar">x
            </button>
        </div>

    <div class="grup">
        <label>ID de encomienda</label>
        <input type="text" id="idConsulta" placeholder="Ej: ENC-00001" autocomplete="off">
    </div>

    <button type="button" id="btnConsultar">
        Consultar
    </button>

    <div id="searchMessage"></div>
</div>
    

    <!-- ========================= -->
    <!--        RESULTADO          -->
    <!-- ========================= -->

    <div id="resultadoConsulta">

        <div class="dato">
            <strong>ID:</strong>
            <span id="resultadoId"></span>
        </div>

        <div class="dato">
            <strong>Residente:</strong>
            <span id="resultadoNombre"></span>
        </div>

        <div class="dato">
            <strong>Departamento:</strong>
            <span id="resultadoDepto"></span>
        </div>

        <div class="dato">
            <strong>Tipo:</strong>
            <span id="resultadoBulto"></span>
        </div>

        <div class="dato">
            <strong>Ingreso:</strong>
            <span id="resultadoIngreso"></span>
        </div>

        <div class="dato">
            <strong>Estado:</strong>
            <span
                class="estado"
                id="resultadoEstado"
            ></span>
        </div>

        <div
            class="dato"
            id="bloqueRetiro"
            style="display:none;"
        >
            <strong>Retiro:</strong>
            <span id="resultadoRetiro"></span>
        </div>
        <div
            id="accionRetiro"
            style="display:none; margin-top:15px;"
        >
            <button
                type="button"
                id="btnRegistrarRetiro"
                style="background:#10b981;"
        >
                ✅ Registrar retiro 
            </button>
    </div>

    </div>

</div>

<script>

    // ========================================== //
    //               CONFIGURACIÓN                //
    // ========================================== //

    const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbweVE252ukrunlxgLPht9Xcgn1JZd5dB0yEwX43zgne6S8A1ifVGOAVJ4-k7uKE4Ua0xg/exec";


    // ========================================== //
    //          REGISTRO DE ENCOMIENDA            //
    // ========================================== //

    document
        .getElementById('encomiendaForm')
        .addEventListener('submit', function(e) {

            e.preventDefault();

            const form = e.target;
            const button = form.querySelector('button');
            const statusMessage =
                document.getElementById('statusMessage');

            button.disabled = true;
            button.innerText = 'Procesando...';

            statusMessage.style.display = 'none';
            statusMessage.style.opacity = '1';

            const formData = new FormData(form);
            const data = new URLSearchParams(formData);

            fetch(form.action, {
                method: 'POST',
                body: data,
                mode: 'no-cors'
            })
            .then(() => {

                statusMessage.style.backgroundColor = '#10b981';
                statusMessage.style.color = '#fff';
                statusMessage.style.display = 'block';
                statusMessage.innerText = '✅ Registro Exitoso';

                form.reset();

                setTimeout(function() {

                    statusMessage.style.opacity = '0';

                    setTimeout(function() {
                        statusMessage.style.display = 'none';
                    }, 500);

                }, 5000);

            })
            .catch(error => {

                statusMessage.style.backgroundColor = '#ef4444';
                statusMessage.style.color = '#fff';
                statusMessage.style.display = 'block';
                statusMessage.innerText =
                    '❌ Error de Red: ' + error;

                setTimeout(function() {
                    statusMessage.style.display = 'none';
                }, 5000);

            })
            .finally(() => {

                button.disabled = false;
                button.innerText = 'Registrar y Enviar';

            });

        });


    // ========================================== //
    //          CONSULTA DE ENCOMIENDA            //
    // ========================================== //

    const btnConsultar =
        document.getElementById('btnConsultar');

    const idConsulta =
        document.getElementById('idConsulta');

    const resultadoConsulta =
        document.getElementById('resultadoConsulta');

    const searchMessage =
        document.getElementById('searchMessage');


    // ========================================== //
    //            CONSULTAR ENCOMIENDA            //
    // ========================================== //

    btnConsultar.addEventListener('click', function() {

    const id = idConsulta.value.trim().toUpperCase();

    resultadoConsulta.style.display = 'none';
    searchMessage.style.display = 'none';

    if (!id) {
        mostrarMensajeBusqueda(
            '⚠️ Ingresa un ID de encomienda.',
            '#f59e0b'
        );
        return;
    }

    btnConsultar.disabled = true;
    btnConsultar.innerText = 'Consultando...';

    const callbackName =
        'consultaEncomienda_' + Date.now();
        console.log('CALLBACK GENERADO:', callbackName);

    const scriptConsulta =
        document.createElement('script');

    window[callbackName] = function(data) {

        try {

            if (data && data.encontrado) {

                mostrarResultado(data);

            } else {

                mostrarMensajeBusqueda(
                    '❌ ' +
                    (
                        data && data.mensaje
                            ? data.mensaje
                            : 'No se encontró la encomienda.'
                    ),
                    '#ef4444'
                );
            }

        } catch (error) {

            console.error(
                'Error procesando consulta:',
                error
            );

            mostrarMensajeBusqueda(
                '❌ Error al procesar la respuesta.',
                '#ef4444'
            );
        }

        btnConsultar.disabled = false;
        btnConsultar.innerText = 'Consultar';

        delete window[callbackName];

        if (
            scriptConsulta &&
            scriptConsulta.parentNode
        ) {
            scriptConsulta.parentNode.removeChild(
                scriptConsulta
            );
        }
    };

    scriptConsulta.src =
        SCRIPT_URL +
        '?id=' +
        encodeURIComponent(id) +
        '&callback=' +
        encodeURIComponent(callbackName);

    scriptConsulta.onerror = function() {

        console.error(
            'No se pudo cargar:',
            scriptConsulta.src
        );

        mostrarMensajeBusqueda(
            '❌ No fue posible consultar el servidor.',
            '#ef4444'
        );

        btnConsultar.disabled = false;
        btnConsultar.innerText = 'Consultar';

        delete window[callbackName];

        if (
            scriptConsulta &&
            scriptConsulta.parentNode
        ) {
            scriptConsulta.parentNode.removeChild(
                scriptConsulta
            );
        }
    };

    document.body.appendChild(
        scriptConsulta
    );

});

    // --------------------------- //
    //      MOSTRAR RESULTADO      //
    // --------------------------- //

function mostrarResultado(data) {

    document.getElementById(
        'resultadoId'
    ).textContent =
        data.id || '';

    document.getElementById(
        'resultadoNombre'
    ).textContent =
        data.nombre || '';

    document.getElementById(
        'resultadoDepto'
    ).textContent =
        data.depto || '';

    document.getElementById(
        'resultadoBulto'
    ).textContent =
        data.bulto || '';

    document.getElementById(
        'resultadoIngreso'
    ).textContent =
        formatearFecha(
            data.fechaIngreso
        );


    // ---------------- //
    //      ESTADO      //
    // ---------------- //

    const estadoElemento =
        document.getElementById(
            'resultadoEstado'
        );

    const estado =
        String(
            data.estado || ''
        ).trim().toUpperCase();

    estadoElemento.textContent =
        data.estado || 'SIN ESTADO';


    // ---------------------- //
    //      COLOR ESTADO      //
    // ---------------------- //

    if (estado === 'RECIBIDA') {

        estadoElemento.style.backgroundColor = '#6c5ce7';

    } else if (estado === 'RETIRADA') {

        estadoElemento.style.backgroundColor = '#10b981';

    } else if (estado === 'INCIDENCIA') {

        estadoElemento.style.backgroundColor = '#ef4444';

    } else {

        estadoElemento.style.backgroundColor = '#64748b';
    }


    // -------------------------------- //
    //      INFORMACIÓN DEL RETIRO      //
    // -------------------------------- //

    const bloqueRetiro =
        document.getElementById(
            'bloqueRetiro'
        );

    const resultadoRetiro =
        document.getElementById(
            'resultadoRetiro'
        );

    if (
        data.fechaRetiro || data.horaRetiro
    ) {

        bloqueRetiro.style.display = 'block';
        resultadoRetiro.textContent =
            (
                data.fechaRetiro || ''
            ) +
            ' ' +
            (
                data.horaRetiro || ''
            );

    } else {

        bloqueRetiro.style.display = 'none';
        resultadoRetiro.textContent = '';
    }

    // -------------------------------- //
    //      BOTÓN REGISTRAR RETIRO      //
    // -------------------------------- //

    const accionRetiro =
        document.getElementById(
            'accionRetiro'
        );

    const btnRegistrarRetiro =
        document.getElementById(
            'btnRegistrarRetiro'
        );

    if (estado === 'RECIBIDA') {

        accionRetiro.style.display = 'block';
        btnRegistrarRetiro.disabled = false;

    } else {

        accionRetiro.style.display = 'none';
        btnRegistrarRetiro.disabled = true;
    }



    // --------------------------- //
    //      GUARDAR ID ACTUAL      //
    // --------------------------- //

    btnRegistrarRetiro.dataset.id = data.id || '';


    // --------------------------- //
    //      MOSTRAR RESULTADO      //
    // --------------------------- //

    resultadoConsulta.style.display = 'block';
}


// -------------------------- //
//      REGISTRAR RETIRO      //
// -------------------------- //

document
    .getElementById('btnRegistrarRetiro')
    .addEventListener(
        'click',
        function() {

            const boton = this;

            const id =
                String(
                    boton.dataset.id || ''
                )
                .trim()
                .toUpperCase();


            // -------------------- //
            //      VALIDAR ID      //
            // -------------------- //

            if (!id) {

                mostrarMensajeBusqueda(
                    '❌ No se encontró el ID de la encomienda.', '#ef4444'
                );

                return;
            }


            // ---------------------- //
            //      CONFIRMACIÓN      //
            // ---------------------- //

            const confirmar =
                confirm(
                    '¿Confirmas que la encomienda ' + id +
                    ' fue retirada por el residente?'
                );

            if (!confirmar) {

                return;

            }


            // ------------------------ //
            //      BLOQUEAR BOTÓN      //
            // ------------------------ //

            boton.disabled = true;

            boton.innerText = 'Registrando retiro...';


            // ------------------------ //
            //      PREPARAR DATOS      //
            // ------------------------ //

            const datosRetiro =
                new URLSearchParams();


            datosRetiro.append(
                'accion',
                'retirar'
            );


            datosRetiro.append(
                'id',
                id
            );


            // ----------------------- //
            //      ENVIAR RETIRO      //
            // ----------------------- //

            fetch(
                SCRIPT_URL,
                {
                    method: 'POST',
                    body: datosRetiro,
                    mode: 'no-cors'
                }
            )
            .then(function() {

                /*
                 * Como usamos no-cors,
                 * el navegador no permite leer
                 * directamente la respuesta.
                 *
                 * Esperamos un momento para que
                 * Apps Script termine de actualizar
                 * Google Sheets.
                 */

                setTimeout(
                    function() {

                        consultarID(
                            id
                        );

                    },
                    1200
                );

            })
            .catch(
                function(error) {

                    console.error(
                        'Error registrando retiro:', error
                    );

                    mostrarMensajeBusqueda(
                        '❌ Error al registrar el retiro.', '#ef4444'
                    );
  
                    boton.disabled = false;

                    boton.innerText = '✅ Registrar retiro';
                }
            );

        }
    );


// ------------------------- //
//      CONFIRMAR RETIRO     //
// ------------------------- //

function consultarID(id) {

    const boton =
        document.getElementById(
            'btnRegistrarRetiro'
        );

    const callbackName =
        'confirmarRetiro_' + Date.now();

    const scriptConsulta =
        document.createElement('script');


    // ------------------ //
    //      CALLBACK      //
    // ------------------ //

    window[callbackName] =
        function(data) {

            try {

                if (
                    data &&
                    data.encontrado
                ) {

                    mostrarResultado(
                        data
                    );

                    const estado =
                        String(
                            data.estado || ''
                        )
                        .trim()
                        .toUpperCase();

                    if (
                        estado === 'RETIRADA'
                    ) {

                        mostrarMensajeBusqueda(
                            '✅ Retiro registrado correctamente.', '#10b981'
                        );

                    } else {

                        mostrarMensajeBusqueda(
                            '⚠️ El retiro fue enviado, pero aún no se pudo confirmar.', '#f59e0b'
                        );
                    }

                } else {

                    mostrarMensajeBusqueda(
                        '❌ No se pudo consultar la encomienda.', '#ef4444'
                    );

                }
                
            } catch (error) {

                console.error(
                    'Error confirmando retiro:', error
                );

                mostrarMensajeBusqueda(
                    '❌ Error al procesar la confirmación.', '#ef4444'
                );
            }


            // ------------------------ //
            //      RESTAURAR BOTÓN     //
            // ------------------------ //

            if (boton) {

                boton.disabled = false;
                boton.innerText = '✅ Registrar retiro';
            }


            // ----------------- //
            //      LIMPIAR      //
            // ----------------- //

            delete window[callbackName];

            if (
                scriptConsulta && scriptConsulta.parentNode
            ) {

                scriptConsulta.parentNode
                    .removeChild(
                        scriptConsulta
                    );
            }
        };


    // ------------------- //
    //      URL JSONP      //
    // ------------------- //

    scriptConsulta.src =
        SCRIPT_URL + '?id=' +
        encodeURIComponent(id) + '&callback=' +
        encodeURIComponent(
            callbackName
        );


    // --------------- //
    //      ERROR      //
    // --------------- //

    scriptConsulta.onerror =
        function() {

            mostrarMensajeBusqueda(
                '❌ No fue posible verificar el retiro.', '#ef4444'
            );


            if (boton) {

                boton.disabled = false;
                boton.innerText = '✅ Registrar retiro';

            }

            delete window[callbackName];

            if (
                scriptConsulta && scriptConsulta.parentNode
            ) {

                scriptConsulta.parentNode.removeChild(
                        scriptConsulta
                    );
            }

        };


    // ------------------ //
    //      EJECUTAR      //
    // ------------------ //

    document.body.appendChild(
        scriptConsulta
    );

}
//==============================================================================================================================================//
    // ========================================== //
    //             FORMATO DE FECHA               //
    // ========================================== //

    function formatearFecha(valor) {

        if (!valor) {
            return '';
        }

        const fecha = new Date(valor);

        if (isNaN(fecha.getTime())) {
            return valor;
        }

        return fecha.toLocaleString('es-CL', {
            dateStyle: 'short',
            timeStyle: 'medium'
        });

    }


    // ========================================== //
    //             MENSAJE DE CONSULTA            //
    // ========================================== //

    function mostrarMensajeBusqueda(
        mensaje,
        color
    ) {

        searchMessage.style.backgroundColor = color;
        searchMessage.style.color = '#fff';
        searchMessage.style.display = 'block';
        searchMessage.style.opacity = '1';
        searchMessage.innerText = mensaje;

    }



    // ========================================== //
    //           ABRIR / CERRAR CONSULTA          //
    // ========================================== //

    
    const btnAbrirConsulta =
        document.getElementById('btnAbrirConsulta');

    const btnCerrarConsulta =
        document.getElementById('btnCerrarConsulta');

    const panelConsulta =
        document.getElementById('panelConsulta');

    btnAbrirConsulta.addEventListener(
        'click',
        function(){
            panelConsulta.style.display ='block';
            btnAbrirConsulta.style.display ='none';
            document.getElementById('idConsulta').focus();
        }
    );

    btnCerrarConsulta.addEventListener(
        'click',
        function(){
            panelConsulta.style.display ='none';
            btnAbrirConsulta.style.display ='block';
        }
    );
</script>
