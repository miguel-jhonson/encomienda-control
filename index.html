<!DOCTYPE html>
</form>
        <!-- Mensaje de confirmación oculto por defecto -->
        <div id="statusMessage" style="display:none; margin-top:20px; padding:12px; border-radius:6px; font-weight:bold; text-align:center;"></div>
    </div>

    <script>
        document.getElementById('encomiendaForm').addEventListener('submit', function(e) {
            e.preventDefault(); // EVITA QUE ABRA OTRA PESTAÑA O SE RECARGUE LA PÁGINA
            
            const form = e.target;
            const button = form.querySelector('button');
            const statusMessage = document.getElementById('statusMessage');
            
            // Efecto visual: Bloquear botón mientras el servidor procesa en la nube
            button.disabled = true;
            button.innerText = 'Procesando en Servidor...';
            statusMessage.style.display = 'none';

            // Crear el paquete de datos para enviar por POST
            const formData = new FormData(form);
            const data = new URLSearchParams(formData);

            // Disparo asíncrono (AJAX) hacia tu Web App de Google
            fetch(form.action, {
                method: 'POST',
                body: data,
                mode: 'no-cors' // Evita bloqueos de seguridad del navegador (CORS)
            })
            .then(() => {
                // Éxito: Mostrar cartel verde elegante sin salir de la app
                statusMessage.style.backgroundColor = '#10b981';
                statusMessage.style.color = '#fff';
                statusMessage.style.display = 'block';
                statusMessage.innerText = '✅ Registro Exitoso y Mensaje Enviado';
                
                // Limpiar los campos para el siguiente paquete que llegue
                form.reset();
            })
            .catch(error => {
                // Manejo de excepciones en la red
                statusMessage.style.backgroundColor = '#ef4444';
                statusMessage.style.color = '#fff';
                statusMessage.style.display = 'block';
                statusMessage.innerText = '❌ Error de Conexión: ' + error;
            })
            .finally(() => {
                // Devolver el botón a su estado normal
                button.disabled = false;
                button.innerText = 'Registrar y Enviar';
            });
        });
    </script>
</body>
</html>
